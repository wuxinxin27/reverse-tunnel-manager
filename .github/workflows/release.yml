name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-linux:
    name: Ubuntu 安装包
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 .deb 和 .tar.gz
        run: bash packaging/linux/build.sh "${{ steps.ver.outputs.version }}" "https://github.com/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz

  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 与 pywebview
        run: pip install --no-cache-dir pyinstaller pywebview pystray pillow

      - name: 打包单文件 exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole `
            --name ReverseTunnelManager `
            --icon assets/icon.ico `
            --add-data "static;static" `
            --add-data "assets;assets" `
            --collect-all webview `
            --collect-all clr_loader `
            --hidden-import clr `
            --hidden-import pystray._win32 `
            desktop.py

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*setup.exe

  build-macos:
    name: macOS 安装包（.dmg）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --no-cache-dir pyinstaller pywebview pystray pillow

      - name: 生成 icns 图标
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon-512.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon-512.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: PyInstaller 打包 .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name ReverseTunnelManager \
            --icon build/icon.icns \
            --osx-bundle-identifier io.github.wuxinxin27.reversetunnelmanager \
            --add-data "static:static" \
            --add-data "assets:assets" \
            --collect-all webview \
            desktop.py

      - name: 制作 DMG
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          mkdir -p dist
          hdiutil create -volname "Reverse Tunnel Manager" \
            -srcfolder "dist/ReverseTunnelManager.app" -ov -format UDZO \
            "dist/ReverseTunnelManager-${VERSION}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

  release:
    name: 发布 Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
