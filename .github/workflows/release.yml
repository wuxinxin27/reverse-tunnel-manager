name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-linux:
    name: Ubuntu 安装包
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 .deb 和 .tar.gz
        run: bash packaging/linux/build.sh "${{ steps.ver.outputs.version }}" "https://github.com/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz

      - name: 冒烟测试：解包运行 .tar.gz（后台模式 → API 可用 → 干净退出）
        run: |
          mkdir -p /tmp/smoke && tar -xzf dist/*.tar.gz -C /tmp/smoke
          APP_DIR="$(find /tmp/smoke -maxdepth 1 -mindepth 1 -type d | head -1)"
          rm -rf /tmp/rtm-smoke-c /tmp/rtm-smoke-d
          RTM_CONFIG_DIR=/tmp/rtm-smoke-c RTM_DATA_DIR=/tmp/rtm-smoke-d \
            python3 "$APP_DIR/desktop.py" --background --port 8896 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 1
            if curl -sf -m 3 http://127.0.0.1:8896/api/state >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            kill -9 $APP_PID 2>/dev/null
            echo "::error::tar.gz 解包后启动失败（API 无响应）"
            exit 1
          fi
          echo "✅ tar.gz 运行正常"
          curl -sf -m 5 -X POST http://127.0.0.1:8896/api/quit >/dev/null
          for i in $(seq 1 15); do sleep 1; kill -0 $APP_PID 2>/dev/null || break; done
          if kill -0 $APP_PID 2>/dev/null; then kill -9 $APP_PID; echo "::error::未能干净退出"; exit 1; fi
          echo "✅ 干净退出"

  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 与 pywebview
        run: pip install --no-cache-dir pyinstaller pywebview pystray pillow

      - name: 打包目录版（onedir，避免单文件解压到 %TEMP% 被杀软/清理工具拦截）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name ReverseTunnelManager `
            --icon assets/icon.ico `
            --add-data "static;static" `
            --add-data "assets;assets" `
            --collect-all webview `
            --collect-all clr_loader `
            --collect-all pystray `
            --hidden-import clr `
            --hidden-import pystray._win32 `
            desktop.py

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*setup.exe

      - name: 上传目录版（用于自动校验打包内容）
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/ReverseTunnelManager/

      - name: 冒烟测试 A：直接运行目录版（验证 DLL 从安装目录加载 + API + 干净退出）
        shell: pwsh
        run: |
          $env:RTM_CONFIG_DIR = "$env:RUNNER_TEMP\rtm-smoke-a-c"
          $env:RTM_DATA_DIR = "$env:RUNNER_TEMP\rtm-smoke-a-d"
          # 预置一条隧道：托盘菜单必须能构建"隧道开关"项（回归：pystray 动作只允许 0~2 参数）
          New-Item -ItemType Directory -Force -Path $env:RTM_CONFIG_DIR | Out-Null
          $cfg = '{"settings":{},"tunnels":[{"id":"cismoke","name":"CI冒烟隧道","mode":"custom","host":"127.0.0.1","port":22,"user":"root","rules":[{"remote_port":17999,"local_target":"127.0.0.1:7890"}],"enabled":false}]}'
          Set-Content -Path "$env:RTM_CONFIG_DIR\config.json" -Value $cfg -Encoding utf8
          $exe = "dist\ReverseTunnelManager\ReverseTunnelManager.exe"
          if (-not (Test-Path "dist\ReverseTunnelManager\_internal\python312.dll")) { throw "目录版缺少 _internal\python312.dll" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--background","--port","8899" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:8899/api/state" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "目录版启动后 API 未响应（DLL 加载失败？）" }
          $state = ($r.Content | ConvertFrom-Json)
          Write-Host "✅ 目录版运行正常：version=$($state.version)"
          Write-Host "等待托盘健康检查（含重试窗口，最多 ~65 秒）…"
          Start-Sleep -Seconds 62
          $state2 = (Invoke-WebRequest "http://127.0.0.1:8899/api/state" -UseBasicParsing -TimeoutSec 5).Content | ConvertFrom-Json
          if ($state2.tray -ne $true) {
            $plog = "$env:RUNNER_TEMP\rtm-smoke-a-d\logs\desktop.log"
            if (Test-Path $plog) { Write-Host "---- desktop.log ----"; Get-Content $plog | Select-Object -Last 40 }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "背景模式托盘未确认显示（state.tray=$($state2.tray)）"
          }
          Write-Host "✅ 背景模式托盘图标已确认真实显示（state.tray=true）"
          Invoke-WebRequest "http://127.0.0.1:8899/api/quit" -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null
          foreach ($i in 1..15) { if ($proc.HasExited) { break }; Start-Sleep -Seconds 1 }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force; throw "未能干净退出" }
          Write-Host "✅ 干净退出"

      - name: 诊断实验：Windows 进程 I/O 计数是否包含套接字流量（流量统计用）
        shell: pwsh
        run: |
          python packaging/smoke/io_probe.py 2>&1


      - name: 冒烟测试 B：先装 v1.1.4 旧版并运行 → 覆盖安装新版（强制关闭旧进程）→ 运行
        shell: pwsh
        run: |
          # 1) 安装旧版（v1.1.4，单文件版）——模拟用户当前状态
          $old = "$env:RUNNER_TEMP\old-setup.exe"
          Invoke-WebRequest "https://github.com/wuxinxin27/reverse-tunnel-manager/releases/download/v1.1.4/ReverseTunnelManager-1.1.4-setup.exe" -OutFile $old
          Start-Process -FilePath $old -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
          $app = "$env:LOCALAPPDATA\Programs\ReverseTunnelManager\ReverseTunnelManager.exe"
          if (-not (Test-Path $app)) { throw "旧版安装后未找到 exe" }
          # 2) 启动旧版后台实例（模拟升级时后台实例正在运行）
          $env:RTM_CONFIG_DIR = "$env:RUNNER_TEMP\rtm-smoke-b-c"
          $env:RTM_DATA_DIR = "$env:RUNNER_TEMP\rtm-smoke-b-d"
          $oldProc = Start-Process -FilePath $app -ArgumentList "--background","--port","8895" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:8895/api/state" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $oldProc.Id -Force -ErrorAction SilentlyContinue; throw "旧版后台实例启动失败" }
          Write-Host "✅ 旧版后台实例运行中"
          # 3) 覆盖安装新版（带强制关闭，等价于自动更新脚本的安装方式）
          $setup = (Get-ChildItem "dist\*setup.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/FORCECLOSEAPPLICATIONS" -Wait
          foreach ($i in 1..30) { if ($oldProc.HasExited) { break }; Start-Sleep -Seconds 1 }
          if (-not $oldProc.HasExited) { Stop-Process -Id $oldProc.Id -Force; throw "升级安装未关闭旧的后台实例" }
          Write-Host "✅ 升级安装成功，旧实例已关闭"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\ReverseTunnelManager\_internal\python312.dll")) { throw "新版安装目录缺少 _internal\python312.dll" }
          # 4) 运行升级后的新版
          $proc = Start-Process -FilePath $app -ArgumentList "--background","--port","8898" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:8898/api/state" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "升级后的新版启动失败" }
          Write-Host "✅ 升级后的新版运行正常"
          Invoke-WebRequest "http://127.0.0.1:8898/api/quit" -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null
          foreach ($i in 1..8) { if ($proc.HasExited) { break }; Start-Sleep -Seconds 1 }
          if (-not $proc.HasExited) {
            Write-Host "退出较慢，重试一次 /api/quit …"
            try { Invoke-WebRequest "http://127.0.0.1:8898/api/quit" -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null } catch {}
            foreach ($i in 1..15) { if ($proc.HasExited) { break }; Start-Sleep -Seconds 1 }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force; throw "未能干净退出" }
          Write-Host "✅ 干净退出"

      - name: 冒烟测试 D：窗口模式（WebView2 窗口 + 托盘真实可用性 + API 退出）
        shell: pwsh
        run: |
          $env:RTM_CONFIG_DIR = "$env:RUNNER_TEMP\rtm-smoke-d-c"
          $env:RTM_DATA_DIR = "$env:RUNNER_TEMP\rtm-smoke-d-d"
          # 预置一条隧道：窗口模式托盘菜单同样要能构建（回归：pystray 动作只允许 0~2 参数）
          New-Item -ItemType Directory -Force -Path $env:RTM_CONFIG_DIR | Out-Null
          $cfg = '{"settings":{},"tunnels":[{"id":"cismoke","name":"CI冒烟隧道","mode":"custom","host":"127.0.0.1","port":22,"user":"root","rules":[{"remote_port":17999,"local_target":"127.0.0.1:7890"}],"enabled":false}]}'
          Set-Content -Path "$env:RTM_CONFIG_DIR\config.json" -Value $cfg -Encoding utf8
          $exe = "dist\ReverseTunnelManager\ReverseTunnelManager.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--port","8894" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:8894/api/state" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "窗口模式启动后 API 未响应" }
          Write-Host "✅ 窗口模式启动成功，等待托盘确认（含重试窗口，最多 ~65 秒）…"
          Start-Sleep -Seconds 62
          $state = (Invoke-WebRequest "http://127.0.0.1:8894/api/state" -UseBasicParsing -TimeoutSec 5).Content | ConvertFrom-Json
          $plog = "$env:RUNNER_TEMP\rtm-smoke-d-d\logs\desktop.log"
          if ($state.tray -ne $true) {
            $log = if (Test-Path $plog) { Get-Content $plog -Raw } else { "" }
            if ($log -match "WebView2 窗口启动失败") {
              Write-Host "⚠️ WebView2 不可用已回退（该模式下无托盘属预期），跳过托盘断言"
            } else {
              Write-Host "---- desktop.log（尾部）----"
              if ($log.Length -gt 2000) { Write-Host $log.Substring($log.Length - 2000) } else { Write-Host $log }
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "窗口模式托盘未确认显示（state.tray=$($state.tray)）"
            }
          } else {
            Write-Host "✅ 窗口模式托盘图标已确认真实显示（state.tray=true）"
          }
          Invoke-WebRequest "http://127.0.0.1:8894/api/quit" -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null
          foreach ($i in 1..20) { if ($proc.HasExited) { break }; Start-Sleep -Seconds 1 }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force; throw "窗口模式未能通过 API 干净退出" }
          Write-Host "✅ 窗口模式干净退出"

      - name: 冒烟测试 C：应用内自动更新全流程（模拟 API 提供安装包 → 下载 → 静默安装 → 自动重启）
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\ReverseTunnelManager\ReverseTunnelManager.exe"
          $setup = (Get-ChildItem "dist\*setup.exe" | Select-Object -First 1).FullName
          $mock = Start-Process python -ArgumentList "packaging/smoke/mock_release_api.py","--port","8902","--tag","v9.9.9","--asset","http://127.0.0.1:8902/setup.exe","--serve-file","$setup" -PassThru
          Start-Sleep -Seconds 2
          $env:RTM_CONFIG_DIR = "$env:RUNNER_TEMP\rtm-smoke-c-c"
          $env:RTM_DATA_DIR = "$env:RUNNER_TEMP\rtm-smoke-c-d"
          $env:RTM_UPDATE_API = "http://127.0.0.1:8902/latest"
          $env:RTM_UPDATE_TRUST_PREFIX = "http://127.0.0.1:8902/"
          $proc = Start-Process -FilePath $app -ArgumentList "--background","--port","8895" -PassThru
          Write-Host "等待自动更新流程（下载→安装→重启）…"
          $ok = $false
          $deadline = (Get-Date).AddSeconds(240)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              try { $r = Invoke-WebRequest "http://127.0.0.1:8895/api/state" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            }
          }
          if (-not $ok) {
            Write-Host "❌ 未检测到重启后的实例（端口 8895），收集诊断信息："
            Get-Process ReverseTunnelManager -ErrorAction SilentlyContinue | Select-Object Id,Path | Format-List
            foreach ($n in @("update\apply_update.log", "logs\desktop.log")) {
              $p = "$env:RUNNER_TEMP\rtm-smoke-c-d\$n"
              if (Test-Path $p) { Write-Host "---- $n ----"; Get-Content $p }
            }
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
            throw "自动更新流程未在 4 分钟内完成重启"
          }
          Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✅ 自动更新完成，应用已自动重启并响应 API（端口 8895）"
          $log = "$env:RUNNER_TEMP\rtm-smoke-c-d\update\apply_update.log"
          $logText = Get-Content $log -Raw
          if (-not $logText.Contains("exit=0")) { throw "安装器退出码非 0 —— $logText" }
          if (-not $logText.Contains("--background --port 8895")) { throw "重启参数未按原样传递 —— $logText" }
          Write-Host "✅ 安装日志确认：静默安装成功（exit=0）+ 启动参数按原样传递"
          Invoke-WebRequest "http://127.0.0.1:8895/api/quit" -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null
          Start-Sleep -Seconds 3
          Write-Host "✅ 自动更新全流程冒烟测试通过"

  build-macos:
    name: macOS 安装包（.dmg）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --no-cache-dir pyinstaller pywebview pystray pillow

      - name: 生成 icns 图标
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon-512.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon-512.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: PyInstaller 打包 .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name ReverseTunnelManager \
            --icon build/icon.icns \
            --osx-bundle-identifier io.github.wuxinxin27.reversetunnelmanager \
            --add-data "static:static" \
            --add-data "assets:assets" \
            --collect-all webview \
            desktop.py

      - name: 制作 DMG
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          mkdir -p dist
          hdiutil create -volname "Reverse Tunnel Manager" \
            -srcfolder "dist/ReverseTunnelManager.app" -ov -format UDZO \
            "dist/ReverseTunnelManager-${VERSION}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

      - name: 冒烟测试：运行 .app（后台模式 → API 可用 → 干净退出）
        run: |
          rm -rf /tmp/rtm-smoke-c /tmp/rtm-smoke-d
          RTM_CONFIG_DIR=/tmp/rtm-smoke-c RTM_DATA_DIR=/tmp/rtm-smoke-d \
            "dist/ReverseTunnelManager.app/Contents/MacOS/ReverseTunnelManager" --background --port 8897 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 1
            if curl -sf -m 3 http://127.0.0.1:8897/api/state >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            kill -9 $APP_PID 2>/dev/null
            echo "::error::macOS 应用启动后 API 未响应"
            exit 1
          fi
          echo "✅ macOS .app 运行正常"
          curl -sf -m 5 -X POST http://127.0.0.1:8897/api/quit >/dev/null
          for i in $(seq 1 15); do sleep 1; kill -0 $APP_PID 2>/dev/null || break; done
          if kill -0 $APP_PID 2>/dev/null; then kill -9 $APP_PID; echo "::error::未能干净退出"; exit 1; fi
          echo "✅ 干净退出"

  release:
    name: 发布 Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*setup.exe
            artifacts/*.dmg
          generate_release_notes: true
